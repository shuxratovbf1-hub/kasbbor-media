<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--surface:#F4F7F6;--raised:#FFFFFF;--line:#DDE5E2;--ink:#0B1B17;--muted:#5A6B66;--emerald:#087F57;--emerald-soft:#E2F6EE;--emerald-ink:#05603F;--coral:#FF6A55;
--aurora:linear-gradient(135deg,#087F57 0%,#12B886 45%,#FF8A6B 100%);}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ccc;font-family:"Inter",sans-serif;color:var(--ink)}
.s{width:1080px;height:1350px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--surface)}
.d{font-family:"Inter Display","Inter",sans-serif;font-weight:800;letter-spacing:-0.03em}
.top{background:var(--aurora);color:#fff;padding:80px 88px 72px;border-radius:0 0 48px 48px}
.glass{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;display:inline-block;padding:14px 28px;font-size:30px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:52px 88px 0}
.o{background:var(--raised);border-radius:26px;box-shadow:0 1px 2px rgba(11,27,23,.06),0 8px 24px rgba(11,27,23,.08);padding:24px 28px;display:flex;align-items:center;gap:22px}
.n{width:64px;height:64px;border-radius:20px;background:var(--emerald-soft);color:var(--emerald-ink);display:flex;align-items:center;justify-content:center;font-family:"Inter Display";font-weight:800;font-size:34px;flex:none}
.t{font-size:33px;font-weight:700;line-height:1.1}
.r{font-size:23px;font-weight:500;color:var(--muted);margin-top:4px}
.foot{position:absolute;left:88px;right:88px;bottom:64px;display:flex;justify-content:space-between;align-items:center;font-size:28px;font-weight:600;color:var(--muted)}
.cta{display:flex;align-items:center;gap:18px;font-size:34px;font-weight:700;color:var(--ink)}
.dot{width:18px;height:18px;border-radius:50%;background:var(--coral)}
</style></head><body>
<section class="s" id="s1">
  <div class="top">
    <img src="../kit/logo_white.svg" style="height:56px">
    <div style="margin-top:56px"><span class="glass">Savol · Вопрос</span></div>
    <h1 class="d" style="font-size:104px;line-height:1.0;margin-top:34px">Qaysi sohada<br>ish qidiryapsiz?</h1>
    <p style="font-size:36px;font-weight:600;margin-top:26px;opacity:.95">В какой сфере вы ищете работу?</p>
  </div>
  <div class="grid">
    <div class="o"><span class="n">1</span><div><div class="t">Savdo</div><div class="r">Продажи</div></div></div>
    <div class="o"><span class="n">2</span><div><div class="t">Ishlab chiqarish</div><div class="r">Производство</div></div></div>
    <div class="o"><span class="n">3</span><div><div class="t">Restoran, kafe</div><div class="r">Рестораны</div></div></div>
    <div class="o"><span class="n">4</span><div><div class="t">Call-markaz</div><div class="r">Колл-центр</div></div></div>
    <div class="o"><span class="n">5</span><div><div class="t">Ofis</div><div class="r">Офис</div></div></div>
    <div class="o"><span class="n">6</span><div><div class="t">Tibbiyot</div><div class="r">Медицина</div></div></div>
    <div class="o"><span class="n">7</span><div><div class="t">Taʼlim</div><div class="r">Образование</div></div></div>
    <div class="o"><span class="n">8</span><div><div class="t">Haydovchi</div><div class="r">Водители</div></div></div>
  </div>
  <div class="foot"><span class="cta"><span class="dot"></span>Raqamni izohda yozing</span><span>kasbbor.uz</span></div>
</section>
</body></html>
